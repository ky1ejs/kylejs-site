# Spell check for site content and UI text. Run with `pnpm check:spelling`.
# Accepts US and UK spelling; posts use both.
# Add a real word cspell does not know to `words`, keeping the list sorted.
version: "0.2"
language: en,en-GB
useGitignore: true
minWordLength: 3
files:
  - content/**/*.{md,mdx}
  - src/**/*.{md,mdx,astro,ts,tsx}
  - "*.md"
  - docs/**/*.md
ignoreRegExpList:
  # All-caps acronyms, e.g. GFM, DJI's
  - /\b[A-Z]{2,}(?:'?s)?\b/g
  # File names in MDX attributes, e.g. path="/posts/macbook-deskmoun.3mf"
  - /\b[\w-]+\.3mf\b/g
  # Footnote labels, e.g. [^sneddon2003]
  - /\[\^[\w-]+\]/g
