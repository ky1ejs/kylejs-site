name: Update GitHub data

# Refreshes src/data/github.json, the repo activity and stats the home page and
# /projects sort and label by. Commits only when the data changed; that push
# deploys the site.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # GH_DATA_TOKEN: a fine-grained token with read access to private repos
      # named in `activityRepo` (cut-watch/cut). Without it, those repos keep
      # their last committed values.
      - name: Fetch repo data
        run: node scripts/fetch-github-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_DATA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github.json
          git commit -m "Update GitHub data"
          git push
