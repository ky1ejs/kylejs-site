name: Update design screenshots

# Run from the Actions tab on a branch. Regenerates the Storybook reference
# images on the same Linux image CI compares against, and commits them to
# that branch. Screenshots taken on a Mac render fonts differently.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate reference images
        run: pnpm test:design --update-snapshots=all -g "screenshot"

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/design/__screenshots__
          if git diff --cached --quiet; then
            echo "Reference images are unchanged"
          else
            git commit -m "Update design system reference screenshots"
            git push
          fi
