name: Update design screenshots

# Run from the Actions tab on a branch. Regenerates the Storybook reference
# images on the same Linux image CI compares against, and commits them to
# that branch. Screenshots taken on a Mac render fonts differently.
on:
  workflow_dispatch:

permissions:
  contents: write
  # To start the Design system workflow on the new commit (see the last step)
  actions: write

# Two runs on one branch would race to push
concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # Only on a branch other than main: on a tag the push has no branch to go
    # to, and on main it would skip review
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Installs Git LFS hooks, so the PNGs (LFS per .gitattributes) are
          # uploaded on push rather than left as pointers
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate reference images
        run: pnpm test:design --update-snapshots=all -g "screenshot"

      - name: Commit the images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/design/__screenshots__
          if git diff --cached --quiet; then
            echo "Reference images are unchanged"
          else
            git commit -m "Update design system reference screenshots"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN doesn't trigger workflows, so the new
      # commit would otherwise have no checks and the images would never be
      # compared
      - name: Check the new images
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run design-system.yaml --ref "$GITHUB_REF_NAME"
